[package]
name = "mdtool"
version = "0.1.0"
edition = "2021"
description = "A tiny, fast Markdown viewer & editor for Windows"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "viewer", "editor", "windows", "webview2"]
categories = ["text-editors"]

[dependencies]
wry = "0.57"
tao = "0.37"
include_dir = "0.7"
encoding_rs = "0.8"
winreg = "0.56"
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
